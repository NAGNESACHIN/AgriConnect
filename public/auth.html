<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriConnect — Account</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><a class="brand" href="/"><span class="brand-mark">✦</span> AgriConnect</a><nav><a href="/">Procurement</a><a href="/marketplace.html">Marketplace</a></nav></header><main class="auth-page"><section class="auth-card"><p class="eyebrow">AGRICONNECT ACCOUNT</p><h1 id="formTitle">Create your account</h1><p class="muted" id="formSub">Choose your role to personalize the platform.</p><div class="role-grid"><button id="farmerRole" class="selected">🚜 Farmer</button><button id="buyerRole">🛒 Buyer</button></div><form id="authForm"><label>Full name<input id="name" required placeholder="Your name"></label><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" minlength="6" required placeholder="At least 6 characters"></label><button class="button primary full" id="submit">Create account</button></form><p id="msg" class="muted" style="margin-top:16px"></p><p style="margin-top:20px;font-size:13px"><a href="/" style="color:var(--green)">← Back to AgriConnect</a></p></section></main><script>let role='farmer';const farmer=document.getElementById('farmerRole'),buyer=document.getElementById('buyerRole');function setRole(r){role=r;farmer.classList.toggle('selected',r==='farmer');buyer.classList.toggle('selected',r==='buyer')}farmer.onclick=()=>setRole('farmer');buyer.onclick=()=>setRole('buyer');document.getElementById('authForm').onsubmit=e=>{e.preventDefault();const user={name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),role};localStorage.setItem('agriconnect_user',JSON.stringify(user));localStorage.setItem('agriconnect_role',role);document.getElementById('msg').textContent='Account saved for this demo. Redirecting…';setTimeout(()=>location.href='/dashboard.html',500)}</script></body></html>
