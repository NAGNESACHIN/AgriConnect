<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriConnect — Account</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><a class="brand" href="/"><span class="brand-mark">✦</span> AgriConnect</a><nav><a href="/">Procurement</a><a href="/marketplace.html">Marketplace</a></nav></header><main class="auth-page"><section class="auth-card"><p class="eyebrow">AGRICONNECT ACCOUNT</p><h1 id="formTitle">Create your account</h1><p class="muted" id="formSub">Choose your role to personalize the platform.</p><div class="role-grid"><button type="button" id="farmerRole" class="selected">🚜 Farmer</button><button type="button" id="buyerRole">🛒 Buyer</button></div><div class="role-grid" style="margin-top:12px"><button type="button" id="registerMode" class="selected">Create account</button><button type="button" id="loginMode">Sign in</button></div><form id="authForm"><label>Full name<input id="name" required placeholder="Your name"></label><label>Email<input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="password" type="password" minlength="6" required autocomplete="current-password" placeholder="At least 6 characters"></label><button class="button primary full" id="submit">Create account</button></form><p id="msg" class="muted" style="margin-top:16px"></p><p style="margin-top:20px;font-size:13px"><a href="/" style="color:var(--green)">← Back to AgriConnect</a></p></section></main><script>let role='farmer',mode='register';const farmer=document.getElementById('farmerRole'),buyer=document.getElementById('buyerRole'),reg=document.getElementById('registerMode'),login=document.getElementById('loginMode'),nameInput=document.getElementById('name'),submit=document.getElementById('submit'),msg=document.getElementById('msg');function setRole(r){role=r;farmer.classList.toggle('selected',r==='farmer');buyer.classList.toggle('selected',r==='buyer')}function setMode(m){mode=m;reg.classList.toggle('selected',m==='register');login.classList.toggle('selected',m==='login');nameInput.parentElement.style.display=m==='register'?'block':'none';nameInput.required=m==='register';submit.textContent=m==='register'?'Create account':'Sign in';document.getElementById('formTitle').textContent=m==='register'?'Create your account':'Welcome back';msg.textContent=''}farmer.onclick=()=>setRole('farmer');buyer.onclick=()=>setRole('buyer');reg.onclick=()=>setMode('register');login.onclick=()=>setMode('login');document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();msg.textContent='Please wait…';const body={email:document.getElementById('email').value.trim(),password:document.getElementById('password').value};if(mode==='register'){body.name=nameInput.value.trim();body.role=role}try{const r=await fetch(`/api/auth/${mode}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.message||'Request failed');localStorage.setItem('agriconnect_token',data.token);localStorage.setItem('agriconnect_user',JSON.stringify(data.user));localStorage.setItem('agriconnect_role',data.user.role);msg.textContent='Success. Redirecting…';location.href='/dashboard.html'}catch(err){msg.textContent=err.message}};</script></body></html>
