<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriConnect Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><a class="brand" href="/"><span class="brand-mark">✦</span> AgriConnect</a><nav><a href="/">Procurement</a><a href="/marketplace.html">Marketplace</a><a class="active" href="/dashboard.html">Dashboard</a></nav><a class="nav-cta" href="/auth.html" id="authLink">Account</a></header><main class="dash"><div class="section-heading"><p class="eyebrow" id="roleLabel">AGRICONNECT CONSOLE</p><h1 id="welcome">Welcome</h1><p class="muted">Your marketplace activity and procurement journey in one place.</p></div><div class="dash-grid"><article class="dash-card"><h3>Role</h3><div class="metric" id="roleMetric">—</div><p class="muted">Your current demo profile</p></article><article class="dash-card"><h3>Marketplace</h3><div class="metric" id="offerMetric">0</div><p class="muted">Offers submitted</p></article><article class="dash-card"><h3>Next step</h3><div class="metric">→</div><p><a href="/marketplace.html" style="color:var(--green);font-weight:700">Browse crops</a> or return to procurement.</p></article></div><section style="margin-top:24px" class="dash-card"><h3>Recent offers</h3><div id="offers"><p class="muted">Loading…</p></div></section></main><script>const u=JSON.parse(localStorage.getItem('agriconnect_user')||'null');if(!u){location.href='/auth.html'}else{document.getElementById('welcome').textContent=`Welcome, ${u.name.split(' ')[0]}`;document.getElementById('roleMetric').textContent=u.role==='farmer'?'Farmer':'Buyer';document.getElementById('roleLabel').textContent=u.role==='farmer'?'FARMER CONSOLE':'BUYER CONSOLE'}fetch('/api/offers').then(r=>r.json()).then(j=>{const all=j.data||[];document.getElementById('offerMetric').textContent=all.length;document.getElementById('offers').innerHTML=all.slice(-5).reverse().map(o=>`<p><strong>${o.cropName}</strong> · ${o.quantity} kg · ₹${o.offerPrice}/kg · <span class="muted">${o.status}</span></p>`).join('')||'<p class="muted">No offers yet. Visit the marketplace to make one.</p>'}).catch(()=>document.getElementById('offers').innerHTML='<p class="muted">Could not load offers.</p>');document.getElementById('authLink').onclick=()=>{localStorage.clear();return true}</script></body></html>
